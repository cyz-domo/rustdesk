name: Build Multi-Platform (Windows, macOS, Linux, Android)

on:
  workflow_dispatch:
    inputs:
      build_windows_x64:
        description: 'Windows (x64) 便携版'
        type: boolean
        default: true
      build_windows_arm64:
        description: 'Windows (ARM64)'
        type: boolean
        default: false
      build_macos_arm64:
        description: 'macOS Apple Silicon (ARM64 / M系列)'
        type: boolean
        default: true
      build_macos_x64:
        description: 'macOS Intel (x64)'
        type: boolean
        default: false
      build_android_arm64:
        description: 'Android (ARM64 / arm64-v8a .apk)'
        type: boolean
        default: true
      build_android_armv7:
        description: 'Android (ARMv7 / 32位 .apk)'
        type: boolean
        default: false
      build_linux_x64:
        description: 'Linux (x64 .deb & .rpm)'
        type: boolean
        default: true
      build_linux_arm64:
        description: 'Linux (ARM64 .deb & .rpm)'
        type: boolean
        default: true
      create_release:
        description: '自动发布为 GitHub Release 保存产物 (默认关；不勾选时到 Actions run 页的 Artifacts 下载)'
        type: boolean
        default: false
      release_tag:
        description: '自定义 Release 标签 (留空自动按日期时间生成)'
        type: string
        default: ''
      release_title:
        description: '自定义 Release 标题 (留空自动生成)'
        type: string
        default: ''
      prerelease:
        description: '标记为 Pre-release 预发布'
        type: boolean
        default: false

env:
  RUST_VERSION: "1.75"
  SCITER_RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.8"
  CARGO_NDK_VERSION: "3.1.2"
  NDK_VERSION: "r28c"
  LLVM_VERSION: "15.0.6"
  VERSION: "1.5.0"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"

jobs:
  generate-bridge:
    if: ${{ inputs.build_windows_x64 || inputs.build_windows_arm64 || inputs.build_macos_arm64 || inputs.build_macos_x64 || inputs.build_linux_x64 || inputs.build_linux_arm64 || inputs.build_android_arm64 || inputs.build_android_armv7 }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.24.5"
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - name: Install bridge tools
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked

      - name: Generate bridge
        run: |
          pushd flutter
          flutter pub get
          popd
          python3 ./res/inline-sciter.py
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
          git status -s

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h

  build-windows:
    needs: [generate-bridge]
    name: build-windows-${{ matrix.job.arch }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: x86_64,
              os: windows-2022,
              target: x86_64-pc-windows-msvc,
              flutter-arch: x64,
              vcpkg-triplet: x64-windows-static,
              build-args: "--vram"
            }
          - {
              arch: aarch64,
              os: windows-11-arm,
              target: aarch64-pc-windows-msvc,
              flutter-arch: arm64,
              vcpkg-triplet: arm64-windows-static,
              build-args: ""
            }
    steps:
      - name: Check target selection
        id: check_selection
        shell: bash
        run: |
          if [[ "${{ matrix.job.arch }}" == "x86_64" && "${{ inputs.build_windows_x64 }}" == "true" ]]; then
            echo "run_job=true" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.job.arch }}" == "aarch64" && "${{ inputs.build_windows_arm64 }}" == "true" ]]; then
            echo "run_job=true" >> $GITHUB_OUTPUT
          else
            echo "run_job=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout source code
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        if: steps.check_selection.outputs.run_job == 'true'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        id: flutter
        if: steps.check_selection.outputs.run_job == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION || env.FLUTTER_VERSION }}
          architecture: x64

      - name: Force arm64 Dart SDK + engine
        if: steps.check_selection.outputs.run_job == 'true' && matrix.job.arch == 'aarch64'
        run: |
          # CACHE-PATH is only the hostedtoolcache parent; the SDK lives in its flutter/ subdir.
          $flutterRoot = "$env:FLUTTER_ROOT"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "Flutter root: $flutterRoot"
          Remove-Item -Force "$flutterRoot\bin\cache\engine-dart-sdk.stamp" -ErrorAction SilentlyContinue
          & "$flutterRoot\bin\internal\update_dart_sdk.ps1"
          $dartVer = & "$flutterRoot\bin\dart.bat" --version 2>&1 | Out-String
          Write-Host $dartVer
          if ($dartVer -notmatch "windows_arm64") {
            Write-Error "Expected an arm64 Dart SDK but got: $dartVer"
            exit 1
          }
          & "$flutterRoot\bin\flutter.bat" precache --windows
          $engineDir = "$flutterRoot\bin\cache\artifacts\engine"
          Write-Host "Engine artifacts present:"
          Get-ChildItem $engineDir -Directory | Select-Object -ExpandProperty Name | Write-Host
          if (-not (Test-Path "$engineDir\windows-arm64-release")) {
            Write-Error "Expected windows-arm64-release engine artifacts but they are missing (wrong-arch SDK)."
            exit 1
          }

      - name: Replace engine with rustdesk custom flutter engine
        if: steps.check_selection.outputs.run_job == 'true' && matrix.job.arch == 'x86_64'
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $flutterBin = Split-Path -Parent (Get-Command flutter).Source
          $enginePath = Join-Path $flutterBin "cache\artifacts\engine\windows-x64-release"
          New-Item -ItemType Directory -Force -Path $enginePath | Out-Null
          Copy-Item -Force -Recurse windows-x64-release\* $enginePath

      - name: Install Rust toolchain
        if: steps.check_selection.outputs.run_job == 'true'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - name: Cache vcpkg downloads
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\downloads
          key: vcpkg-downloads-windows-${{ env.VCPKG_COMMIT_ID }}
          restore-keys: vcpkg-downloads-windows-

      - name: Setup vcpkg
        if: steps.check_selection.outputs.run_job == 'true'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        if: steps.check_selection.outputs.run_job == 'true'
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          & "$env:VCPKG_ROOT\vcpkg" install --triplet ${{ matrix.job.vcpkg-triplet }} --x-install-root="$env:VCPKG_ROOT\installed"

      - name: Set SODIUM_LIB_DIR (arm64)
        # libsodium-sys ships no arm64 Windows prebuilt lib and would link its x64 one;
        # vcpkg.json builds libsodium for this triplet, so point the crate at it.
        if: steps.check_selection.outputs.run_job == 'true' && matrix.job.arch == 'aarch64'
        shell: bash
        run: echo "SODIUM_LIB_DIR=$VCPKG_ROOT/installed/${{ matrix.job.vcpkg-triplet }}/lib" >> "$GITHUB_ENV"

      - name: Build rustdesk
        if: steps.check_selection.outputs.run_job == 'true'
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
          New-Item -ItemType Directory -Force -Path ./rustdesk | Out-Null
          Copy-Item -Force -Recurse "./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release/*" ./rustdesk/

      - name: Add virtual display driver
        # Mode 2 and Virtual Display support:
        # 1. usbmmidd_v2 for legacy fallback
        # 2. RustDeskIddDriver for 60Hz mode-injected virtual display
        if: steps.check_selection.outputs.run_job == 'true'
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive -Path usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Recurse -Force ./usbmmidd_v2/deviceinstaller.exe, ./usbmmidd_v2/usbmmidd.bat
          Move-Item -Force ./usbmmidd_v2 ./rustdesk/
          Get-ChildItem ./rustdesk/usbmmidd_v2 | Select-Object -ExpandProperty Name
          if ("${{ matrix.job.arch }}" -eq "x86_64") {
            Invoke-WebRequest -Uri https://github.com/rustdesk-org/RustDeskIddDriver/releases/download/v0.3/RustDeskIddDriver_x64.zip -OutFile RustDeskIddDriver_x64.zip
            Expand-Archive -Path RustDeskIddDriver_x64.zip -DestinationPath RustDeskIdd_temp
            Move-Item -Force ./RustDeskIdd_temp/RustDeskIddDriver ./rustdesk/
            if (Test-Path ./RustDeskIdd_temp/RustDeskIddDriver.cer) {
              Copy-Item -Force ./RustDeskIdd_temp/RustDeskIddDriver.cer ./rustdesk/RustDeskIddDriver/
            }
            Remove-Item -Recurse -Force RustDeskIdd_temp, RustDeskIddDriver_x64.zip
            Get-ChildItem ./rustdesk/RustDeskIddDriver | Select-Object -ExpandProperty Name
          }

      - name: Add msbuild to PATH
        if: steps.check_selection.outputs.run_job == 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Build WindowInjection.dll
        # Mode 1 (mag and exclude_from_capture share win_topmost_window::PrivacyModeImpl) only looks
        # for this dll next to the exe, and returns a bare "Failed" without it.
        if: steps.check_selection.outputs.run_job == 'true'
        run: |
          if ("${{ matrix.job.arch }}" -eq "aarch64") { $platform = "ARM64" } else { $platform = "x64" }
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
          pushd RustDeskTempTopMostWindow
          git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=$platform -p:TargetVersion=Windows10
          popd
          Copy-Item -Force "./RustDeskTempTopMostWindow/WindowInjection/$platform/Release/WindowInjection.dll" ./rustdesk/
          Get-ChildItem ./rustdesk/WindowInjection.dll | Select-Object -ExpandProperty Length

      - name: Build self-extracted executable
        if: steps.check_selection.outputs.run_job == 'true'
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          if [ -f "./target/release/rustdesk-portable-packer.exe" ]; then
            cp -f ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe
          elif [ -f "./libs/portable/target/release/rustdesk-portable-packer.exe" ]; then
            cp -f ./libs/portable/target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe
          fi

      - name: Upload Windows Self-Extract Executable
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ env.VERSION }}-windows-${{ matrix.job.arch }}-exe
          path: ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe
          if-no-files-found: warn

      - name: Zip Windows Portable Folder
        if: steps.check_selection.outputs.run_job == 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path ./rustdesk/* -DestinationPath ./rustdesk-${{ env.VERSION }}-windows-${{ matrix.job.arch }}-portable.zip -Force

      - name: Upload Windows Release Zip
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ env.VERSION }}-windows-${{ matrix.job.arch }}-portable-zip
          path: rustdesk-${{ env.VERSION }}-windows-${{ matrix.job.arch }}-portable.zip

  build-macos:
    needs: [generate-bridge]
    name: build-macos-${{ matrix.job.arch }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: aarch64-apple-darwin,
              os: macos-14,
              extra-build-args: "--screencapturekit",
              arch: aarch64,
              vcpkg-triplet: arm64-osx,
            }
          - {
              target: x86_64-apple-darwin,
              os: macos-14,
              extra-build-args: "",
              arch: x86_64,
              vcpkg-triplet: x64-osx,
            }
    steps:
      - name: Check target selection
        id: check_selection
        shell: bash
        run: |
          if [[ "${{ matrix.job.arch }}" == "aarch64" && "${{ inputs.build_macos_arm64 }}" == "true" ]]; then
            echo "run_job=true" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.job.arch }}" == "x86_64" && "${{ inputs.build_macos_x64 }}" == "true" ]]; then
            echo "run_job=true" >> $GITHUB_OUTPUT
          else
            echo "run_job=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout source code
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install build runtime
        if: steps.check_selection.outputs.run_job == 'true'
        run: |
          brew install llvm create-dmg
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        if: steps.check_selection.outputs.run_job == 'true'
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install Flutter
        if: steps.check_selection.outputs.run_job == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        if: steps.check_selection.outputs.run_job == 'true'
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true
          fi

      - name: Workaround for flutter issue
        if: steps.check_selection.outputs.run_job == 'true'
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart || true

      - name: Install Rust toolchain
        if: steps.check_selection.outputs.run_job == 'true'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - name: Cache vcpkg downloads
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/cache@v4
        with:
          path: /Users/runner/vcpkg/downloads
          key: vcpkg-downloads-macos-${{ env.VCPKG_COMMIT_ID }}
          restore-keys: vcpkg-downloads-macos-

      - name: Setup vcpkg
        if: steps.check_selection.outputs.run_job == 'true'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /Users/runner/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        if: steps.check_selection.outputs.run_job == 'true'
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet ${{ matrix.job.vcpkg-triplet }} --x-install-root="$VCPKG_ROOT/installed"

      - name: Build rustdesk
        if: steps.check_selection.outputs.run_job == 'true'
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py || true
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile || true
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml || true
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj || true
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}
          codesign --force --deep --sign - ./flutter/build/macos/Build/Products/Release/RustDesk.app || true

      - name: Create DMG
        if: steps.check_selection.outputs.run_job == 'true'
        run: |
          CREATE_DMG="$(command -v create-dmg)" || true
          if [ -n "$CREATE_DMG" ]; then
            CREATE_DMG="$(readlink -f "$CREATE_DMG")" || true
            sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG" || true
            create-dmg --icon "RustDesk.app" 200 190 --hide-extension "RustDesk.app" --window-size 800 400 --app-drop-link 600 185 rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg ./flutter/build/macos/Build/Products/Release/RustDesk.app || true
          fi
          if [ ! -f "rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg" ]; then
            hdiutil create -volname "RustDesk" -srcfolder ./flutter/build/macos/Build/Products/Release/RustDesk.app -ov -format UDZO rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
          fi

      - name: Upload macOS DMG
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ env.VERSION }}-macos-${{ matrix.job.arch }}-dmg
          path: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
          if-no-files-found: warn

  build-android:
    needs: [generate-bridge]
    name: build-android-${{ matrix.job.arch }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: aarch64,
              target: aarch64-linux-android,
              abi: arm64-v8a,
              os: ubuntu-22.04,
              flag: build_android_arm64,
            }
          - {
              arch: armv7,
              target: armv7-linux-androideabi,
              abi: armeabi-v7a,
              os: ubuntu-22.04,
              flag: build_android_armv7,
            }
    steps:
      - name: Check target selection
        id: check_selection
        shell: bash
        run: |
          if [[ "${{ matrix.job.arch }}" == "aarch64" && "${{ inputs.build_android_arm64 }}" == "true" ]]; then
            echo "run_job=true" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.job.arch }}" == "armv7" && "${{ inputs.build_android_armv7 }}" == "true" ]]; then
            echo "run_job=true" >> $GITHUB_OUTPUT
          else
            echo "run_job=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout source code
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        if: steps.check_selection.outputs.run_job == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang cmake curl gcc gcc-multilib git g++ g++-multilib libc6-dev \
               libclang-dev llvm-dev nasm ninja-build \
               openjdk-17-jdk-headless pkg-config wget

      - name: Setup Flutter
        if: steps.check_selection.outputs.run_job == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup NDK
        if: steps.check_selection.outputs.run_job == 'true'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Restore bridge files
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Cache vcpkg downloads
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/cache@v4
        with:
          path: /opt/artifacts/vcpkg/downloads
          key: vcpkg-downloads-ubuntu-${{ env.VCPKG_COMMIT_ID }}
          restore-keys: vcpkg-downloads-ubuntu-

      - name: Setup vcpkg
        if: steps.check_selection.outputs.run_job == 'true'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        if: steps.check_selection.outputs.run_job == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_ROOT: /opt/artifacts/vcpkg
        run: |
          ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"
        shell: bash

      - name: Install Rust toolchain
        if: steps.check_selection.outputs.run_job == 'true'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - name: Build rustdesk lib
        if: steps.check_selection.outputs.run_job == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          if [ "${{ matrix.job.arch }}" = "aarch64" ]; then
            ./flutter/ndk_arm64.sh
          elif [ "${{ matrix.job.arch }}" = "armv7" ]; then
            ./flutter/ndk_arm.sh
          fi
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/librustdesk.so

      - name: Build Android APK
        if: steps.check_selection.outputs.run_job == 'true'
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties || true
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle || true
          
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}
          if [ -f "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.target }}/libc++_shared.so" ]; then
            cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.target }}/libc++_shared.so" ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/
          elif [ -f "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so" ]; then
            cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so" ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/
          fi
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/librustdesk.so
          
          pushd flutter
          flutter build apk --release --target-platform android-${{ matrix.job.arch == 'aarch64' && 'arm64' || 'arm' }} --split-per-abi
          mv build/app/outputs/flutter-apk/app-${{ matrix.job.abi }}-release.apk ../rustdesk-${{ env.VERSION }}-android-${{ matrix.job.arch }}.apk
          popd

      - name: Upload Android APK
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ env.VERSION }}-android-${{ matrix.job.arch }}-apk
          path: rustdesk-${{ env.VERSION }}-android-${{ matrix.job.arch }}.apk
          if-no-files-found: warn

  build-linux:
    needs: [generate-bridge]
    name: build-linux-${{ matrix.job.arch }}
    runs-on: ${{ matrix.job.on }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: x86_64,
              target: x86_64-unknown-linux-gnu,
              distro: ubuntu18.04,
              on: ubuntu-22.04,
              deb_arch: amd64,
              vcpkg-triplet: x64-linux,
            }
          - {
              arch: aarch64,
              target: aarch64-unknown-linux-gnu,
              distro: ubuntu18.04,
              on: ubuntu-22.04-arm,
              deb_arch: arm64,
              vcpkg-triplet: arm64-linux,
            }
    steps:
      - name: Check target selection
        id: check_selection
        run: |
          if [[ "${{ matrix.job.arch }}" == "x86_64" && "${{ inputs.build_linux_x64 }}" == "true" ]]; then
            echo "run_job=true" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.job.arch }}" == "aarch64" && "${{ inputs.build_linux_arm64 }}" == "true" ]]; then
            echo "run_job=true" >> $GITHUB_OUTPUT
          else
            echo "run_job=false" >> $GITHUB_OUTPUT
          fi

      - name: Maximize build space
        if: steps.check_selection.outputs.run_job == 'true'
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet || true
          sudo apt-get update -y
          sudo apt-get install -y nasm

      - name: Checkout source code
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        if: steps.check_selection.outputs.run_job == 'true'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}

      - name: Restore bridge files
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install CMake for vcpkg on Linux
        if: steps.check_selection.outputs.run_job == 'true'
        run: |
          python3 -m pip install --user "cmake==${VCPKG_CMAKE_VERSION}"
          user_base="$(python3 -m site --user-base)"
          "${user_base}/bin/cmake" --version
          echo "${user_base}/bin" >> "${GITHUB_PATH}"

      - name: Cache vcpkg downloads
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/cache@v4
        with:
          path: /opt/artifacts/vcpkg/downloads
          key: vcpkg-downloads-ubuntu-${{ env.VCPKG_COMMIT_ID }}
          restore-keys: vcpkg-downloads-ubuntu-

      - name: Setup vcpkg
        if: steps.check_selection.outputs.run_job == 'true'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        if: steps.check_selection.outputs.run_job == 'true'
        run: |
          sudo apt install -y libva-dev
          "$VCPKG_ROOT/vcpkg" install --triplet ${{ matrix.job.vcpkg-triplet }} --x-install-root="$VCPKG_ROOT/installed"

      - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8
        name: Build rustdesk in docker
        id: docker_build
        if: steps.check_selection.outputs.run_job == 'true'
        with:
          arch: ${{ matrix.job.arch }}
          distro: ${{ matrix.job.distro }}
          githubToken: ${{ github.token }}
          setup: |
            ls -l "${PWD}"
            ls -l /opt/artifacts/vcpkg/installed
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
          shell: /bin/bash
          install: |
            apt-get update -y
            apt-get install -y build-essential clang cmake curl gcc git g++ libayatana-appindicator3-dev libasound2-dev libclang-10-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-10-dev nasm ninja-build pkg-config python3 rpm unzip wget xz-utils libssl-dev
          run: |
            git config --global --add safe.directory "*"
            pushd /opt
            wget -O rust.tar.gz https://static.rust-lang.org/dist/rust-1.75.0-${{ matrix.job.target }}.tar.gz
            tar -zxvf rust.tar.gz > /dev/null && rm rust.tar.gz
            cd rust-1.75.0-${{ matrix.job.target }} && ./install.sh
            rm -rf rust-1.75.0-${{ matrix.job.target }}
            popd

            pushd /workspace
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            cargo build --locked --lib --features hwcodec,flutter,unix-file-copy-paste --release
            popd

            pushd /workspace
            case ${{ matrix.job.arch }} in
              aarch64)
                export PATH=/opt/flutter-elinux/bin:$PATH
                sed -i "s/flutter build linux --release/flutter-elinux build linux --verbose/g" ./build.py
                sed -i "s/x64\/release/arm64\/release/g" ./build.py
              ;;
              x86_64)
                export PATH=/opt/flutter/bin:$PATH
              ;;
            esac
            popd

            pushd /opt
            wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            case ${{ matrix.job.arch }} in
              aarch64)
                git clone https://github.com/sony/flutter-elinux.git || true
                pushd flutter-elinux
                  git fetch
                  git reset --hard ${{ env.FLUTTER_VERSION }}
                  bin/flutter-elinux doctor -v
                  bin/flutter-elinux precache --linux
                popd
                cp -R flutter/bin/cache/artifacts/engine/linux-x64/shader_lib flutter-elinux/flutter/bin/cache/artifacts/engine/linux-arm64
                rm -rf flutter
              ;;
              x86_64)
                flutter doctor -v
              ;;
            esac
            popd

            if [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]]; then
              case ${{ matrix.job.arch }} in
                aarch64)
                  pushd /opt/flutter-elinux/flutter
                ;;
                x86_64)
                  pushd /opt/flutter
                ;;
              esac
              git apply /workspace/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true
              popd
            fi

            pushd /workspace
            export DEB_ARCH=${{ matrix.job.deb_arch }}
            python3 ./build.py --flutter --skip-cargo
            for name in rustdesk*.deb; do
              [ -f "$name" ] && mv "$name" "rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.deb"
            done

            # RPM package (Fedora / RHEL / CentOS / Rocky Linux / AlmaLinux)
            echo "start packaging RPM package"
            case ${{ matrix.job.arch }} in
              aarch64)
                sed -i "s/linux\/x64/linux\/arm64/g" ./res/rpm-flutter.spec
                ;;
            esac
            HBB=`pwd` rpmbuild ./res/rpm-flutter.spec -bb
            mkdir -p ~/rpmbuild/RPMS/${{ matrix.job.arch }}
            pushd ~/rpmbuild/RPMS/${{ matrix.job.arch }} || pushd ~/rpmbuild/RPMS/*
            for name in rustdesk*.rpm; do
              [ -f "$name" ] && cp -f "$name" /workspace/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.rpm
            done
            popd
            popd

      - name: Upload Linux Packages (DEB & RPM)
        if: steps.check_selection.outputs.run_job == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ env.VERSION }}-linux-${{ matrix.job.arch }}-pkg
          path: |
            rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.deb
            rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.rpm
          if-no-files-found: warn

  publish-release:
    name: Publish Release
    needs: [build-windows, build-macos, build-android, build-linux]
    if: >-
      always() && (inputs.create_release == true || inputs.create_release == 'true') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
      (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository for changelog
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Generate tag and release title
        id: vars
        shell: bash
        run: |
          NOW_UTC=$(date -u '+%H:%M UTC')
          NOW_CST=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')
          
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="build-$(date +'%Y%m%d-%H%M')"
          fi
          
          if [ -n "${{ inputs.release_title }}" ]; then
            TITLE="${{ inputs.release_title }}"
          else
            TITLE="RustDesk 动态 STUN 增强版 v${{ env.VERSION }} ($TAG)"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "now_cst=$NOW_CST" >> $GITHUB_OUTPUT
          echo "now_utc=$NOW_UTC" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p ./release_files
          find ./dist -maxdepth 2 -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.zip" -o -name "*.apk" \) ! -name "*bridge*" -exec cp -f {} ./release_files/ \;
          echo "=== Release Files ==="
          ls -lh ./release_files/

      - name: Generate release notes
        shell: bash
        run: |
          BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          REL="$BASE/releases/download/${{ steps.vars.outputs.tag }}"
          VERSION="${{ env.VERSION }}"
          NOW_CST="${{ steps.vars.outputs.now_cst }}"

          assets_rows() {
            local f order plat arch size hint
            for f in $(ls -1 ./release_files | sort); do
              size=$(wc -c < "./release_files/$f" | awk '{ if ($1 >= 1073741824) printf "%.1f GB", $1 / 1073741824; else if ($1 >= 1048576) printf "%.1f MB", $1 / 1048576; else printf "%.0f KB", $1 / 1024 }')
              order=9; plat="其他"; arch="—"; hint="—"
              case "$f" in
                *windows*portable*.zip) order=1; plat="Windows";    hint="解压后运行目录内的 \`rustdesk.exe\`（绿色便携）" ;;
                *.exe)                  order=2; plat="Windows";    hint="双击即可以便携版运行；主界面可一键安装为系统服务" ;;
                *.dmg)                  order=3; plat="macOS";      hint="挂载后把 RustDesk 拖入「应用程序」" ;;
                *.apk)                  order=4; plat="Android";    hint="传到手机后直接安装（需允许“未知来源”）" ;;
                *.deb)                  order=5; plat="Linux · Debian/Ubuntu";        hint="\`sudo dpkg -i $f\`" ;;
                *.rpm)                  order=6; plat="Linux · RHEL/Fedora/openSUSE"; hint="\`sudo dnf localinstall $f\`" ;;
              esac
              case "$f" in
                *x86_64*)  arch="x64" ;;
                *aarch64*) arch="ARM64" ;;
                *armv7*)   arch="ARMv7 (32 位)" ;;
              esac
              printf '%s\t%s\t%s\t[%s](%s/%s)\t%s\t%s\n' "$order" "$plat" "$arch" "$f" "$REL" "$f" "$size" "$hint"
            done | sort -n | awk -F'\t' '{ printf "| %s | %s | %s | %s | %s |\n", $2, $3, $4, $5, $6 }'
          }

          # Group by conventional-commit prefix so the user-facing changes lead and
          # build/docs churn stays collapsible. Nothing is dropped.
          changelog_md() {
            git log -n 12 --no-merges --pretty=tformat:'%s%x09%h%x09%an' | awk -F'\t' -v base="$BASE" '
              function bucket(m) {
                if (m ~ /^feat/)                                          return "feat"
                if (m ~ /^(fix|hotfix|bugfix|revert)/)                    return "fix"
                if (m ~ /^perf/)                                          return "perf"
                return "minor"
              }
              function bullet() { return sprintf("- %s — [`%s`](%s/commit/%s) · %s\n", $1, $2, base, $2, $3) }
              {
                b = bucket($1)
                cnt[b]++
                items[b] = items[b] bullet()
              }
              END {
                n = split("feat fix perf", keys, " ")
                lab["feat"] = "✨ 新增"; lab["fix"] = "🩹 修复"; lab["perf"] = "⚡ 性能"
                for (i = 1; i <= n; i++)
                  if (items[keys[i]] != "")
                    printf "#### %s（%d）\n\n%s\n", lab[keys[i]], cnt[keys[i]], items[keys[i]]
                if (cnt["minor"] > 0) {
                  printf "<details>\n<summary>🧱 其他改动（%d）</summary>\n\n%s\n</details>\n\n", cnt["minor"], items["minor"]
                }
              }'
          }

          TOTAL=$(git log -n 12 --no-merges --oneline | wc -l)

          {
            printf '版本 `v%s` ｜ 构建 北京时间 %s（%s） ｜ 提交 [`%s`](%s/commit/%s) ｜ 分支 `%s`\n\n' \
              "$VERSION" "$NOW_CST" "${{ steps.vars.outputs.now_utc }}" "${GITHUB_SHA:0:8}" "$BASE" "$GITHUB_SHA" "$GITHUB_REF_NAME"
            printf -- '---\n\n'
            printf '### 📥 下载\n\n'
            printf '按系统选一个即可，同平台多个包功能一致，只是安装形态不同。\n\n'
            printf '| 平台 | 架构 | 安装包 | 大小 | 安装 / 使用 |\n'
            printf '| :--- | :--- | :--- | ---: | :--- |\n'
            assets_rows
            printf '\n> 上表即本次 Release 的全部产物；未列出的平台或架构本次未构建。\n'
            printf '\n---\n\n'
            printf '### 📝 本次变更\n\n'
            printf '<details>\n<summary>展开查看 %s 条提交</summary>\n\n' "$TOTAL"
            changelog_md
            printf '[查看全部提交历史](%s/commits/%s)\n\n' "$BASE" "$GITHUB_SHA"
            printf '</details>\n'
          } > ./release_notes.md

          cat ./release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          body_path: ./release_notes.md
          files: |
            ./release_files/*
